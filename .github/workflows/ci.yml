name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: distribution_hub_test
          POSTGRES_USER: distribution
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distribution -d distribution_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://distribution:test_password@localhost:5432/distribution_hub_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run database migrations
        run: alembic -x "database_url=${TEST_DATABASE_URL}" upgrade head

      - name: Run tests
        run: pytest

      - name: Check code style
        run: ruff check .