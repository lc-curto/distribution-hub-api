[project]
name = "distribution-hub-api"
version = "0.1.0"
description = "API do Distribution Hub"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic-settings>=2.7", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.14", "pwdlib[argon2]>=0.2", "python-jose[cryptography]>=3.3"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
