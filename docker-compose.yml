services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-distribution_hub}
      POSTGRES_USER: ${POSTGRES_USER:-distribution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-distribution_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distribution -d distribution_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
